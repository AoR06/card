<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Surprise</title>
    <style>
        body {
            margin: 0;
            background: #0f0f0f;
            font-family: 'Georgia', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .envelope-wrapper {
            position: relative;
            width: 300px;
            height: 200px;
            background: #a31616;
            border-radius: 0 0 10px 10px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            margin-bottom: 50px;
        }

        .flap {
            position: absolute;
            top: 0;
            width: 0; height: 0;
            border-left: 150px solid transparent;
            border-right: 150px solid transparent;
            border-top: 110px solid #d32f2f;
            transform-origin: top;
            transition: transform 0.6s ease;
            z-index: 3;
        }

        .letter {
            position: absolute;
            bottom: 5px;
            left: 10px;
            width: 280px;
            height: 180px;
            background: #fffdf5;
            color: #333;
            text-align: center;
            border-radius: 5px;
            transition: transform 0.8s ease;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }

        .letter h1 { margin: 0; color: #a31616; font-size: 1.4rem; }
        .letter p { font-size: 1rem; line-height: 1.4; color: #444; }

        .open .flap {
            transform: rotateX(180deg);
            z-index: 1;
        }
        .open .letter {
            transform: translateY(-130px);
            z-index: 4;
            height: 220px;
        }

        #openBtn {
            padding: 12px 35px;
            background: linear-gradient(45deg, #f9d423, #ffdb3a);
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #443300;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(249, 212, 35, 0.4);
            transition: 0.3s;
        }

        .hidden { display: none; }
        canvas { position: absolute; top: 0; left: 0; z-index: 1; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <div class="container">
        <div class="envelope-wrapper" id="envelope">
            <div class="flap"></div>
            <div class="letter">
                <h1>Happy New Year!</h1>
                <p>May 2026 be filled with magic, laughter, and all the success you've been dreaming of! ✨🥂</p>
            </div>
        </div>
        <button id="openBtn" onclick="revealCard()">OPEN SURPRISE</button>
    </div>

    <script>
        function revealCard() {
            document.getElementById('envelope').classList.add('open');
            document.getElementById('openBtn').classList.add('hidden');
            initFireworks();
        }

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor(x, y, color) {
                this.x = x; this.y = y; this.color = color;
                this.velocity = { x: (Math.random() - 0.5) * 10, y: (Math.random() - 0.5) * 10 };
                this.alpha = 1;
            }
            draw() {
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 2.5, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
            update() {
                this.x += this.velocity.x; this.y += this.velocity.y;
                this.alpha -= 0.015;
            }
        }

        function initFireworks() {
            function loop() {
                ctx.fillStyle = 'rgba(15, 15, 15, 0.15)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                if (Math.random() < 0.08) {
                    const x = Math.random() * canvas.width;
                    const y = Math.random() * (canvas.height / 2);
                    const color = `hsl(${Math.random() * 360}, 100%, 60%)`;
                    for (let i = 0; i < 40; i++) particles.push(new Particle(x, y, color));
                }
                particles.forEach((p, i) => {
                    if (p.alpha > 0) { p.update(); p.draw(); }
                    else { particles.splice(i, 1); }
                });
                requestAnimationFrame(loop);
            }
            loop();
        }
    </script>
</body>
</html>
